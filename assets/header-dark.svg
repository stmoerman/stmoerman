<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <title>From open loop to clear next step</title>
  <desc>An open task becomes a prepared draft and then a human-reviewed action.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111729"/>
      <stop offset="1" stop-color="#19243B"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#E9A88B"/>
      <stop offset="0.53" stop-color="#9BA9FF"/>
      <stop offset="1" stop-color="#7BD8B6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-25%" y="-35%" width="150%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.13"/>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="318" rx="28"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="28" fill="url(#background)" stroke="#394764" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <circle cx="1120" cy="12" r="180" fill="#E9A88B" opacity="0.18"/>
    <circle cx="731" cy="339" r="215" fill="#6878D5" opacity="0.23"/>
    <circle cx="1051" cy="292" r="155" fill="#7BD8B6" opacity="0.18"/>
    <path d="M624 210 C694 186 696 113 767 119 S883 192 929 175 S1055 117 1110 190" fill="none" stroke="url(#thread)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M620 234 C710 204 708 142 769 152 S874 220 925 207 S1064 145 1128 216" fill="none" stroke="#9BA9FF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 9" opacity="0.25"/>
  </g>

  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.8" fill="#9BA9FF">STEPHAN MOERMAN  /  KOMMIT AI</text>
  <text x="62" y="151" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-2" fill="#F6F8FE">The next step</text>
  <text x="62" y="212" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-2" fill="#F6F8FE">should happen.</text>
  <rect x="64" y="244" width="35" height="5" rx="2.5" fill="#E9A88B"/>
  <text x="111" y="252" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#B2BED6">AI agents for the work that slips</text>

  <g filter="url(#soft-shadow)">
    <g transform="rotate(-5 741 121)">
      <rect x="638" y="65" width="205" height="113" rx="17" fill="#202D47" stroke="#394764"/>
      <circle cx="667" cy="95" r="8" fill="#E9A88B"/>
      <text x="686" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#B2BED6">01  NOTICE</text>
      <text x="661" y="140" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F6F8FE">A quiet thread</text>
      <rect x="661" y="152" width="111" height="4" rx="2" fill="#394764"/>
    </g>
    <g transform="rotate(4 885 173)">
      <rect x="782" y="114" width="214" height="112" rx="17" fill="#202D47" stroke="#394764"/>
      <circle cx="811" cy="144" r="8" fill="#9BA9FF"/>
      <text x="830" y="149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#B2BED6">02  PREPARE</text>
      <text x="805" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F6F8FE">A useful draft</text>
      <rect x="805" y="200" width="138" height="4" rx="2" fill="#394764"/>
    </g>
    <g transform="rotate(-3 1046 216)">
      <rect x="941" y="164" width="207" height="113" rx="17" fill="#202D47" stroke="#394764"/>
      <circle cx="970" cy="194" r="9" fill="#7BD8B6"/>
      <path d="M966 194 l3 3 5 -6" fill="none" stroke="#F6F8FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="988" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3" fill="#B2BED6">03  REVIEW</text>
      <text x="964" y="237" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F6F8FE">Your call</text>
      <rect x="964" y="250" width="119" height="4" rx="2" fill="#394764"/>
    </g>
  </g>
</svg>
